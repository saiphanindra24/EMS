services:
  db:
    image: postgres:17-alpine
    container_name: emwts_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-emwts_db}
      POSTGRES_USER: ${DB_USER:-emwts_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-emwts_secure_pass_2026}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - emwts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  emwts_pgdata:
