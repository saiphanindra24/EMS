# Local development database only; Next.js runs in the VS Code terminal.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env first}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    ports:
      # Do not expose the development database on every network interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - volksskatt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  volksskatt_pgdata:
